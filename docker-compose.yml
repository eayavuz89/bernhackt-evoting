services:
  web:
    build: .
    image: bernhackt-evoting:latest
    container_name: bernhackt-evoting
    restart: unless-stopped
    ports:
      - "127.0.0.1:18140:80"

  api:
    build: ./server
    image: bernhackt-evoting-api:latest
    container_name: bernhackt-evoting-api
    restart: unless-stopped
    environment:
      - OPENAI_REALTIME_KEY=${OPENAI_REALTIME_KEY}
      - REALTIME_MODEL=${REALTIME_MODEL:-gpt-realtime}
      - REALTIME_VOICE=${REALTIME_VOICE:-marin}
      - PER_IP_PER_MIN=3
      - PER_IP_PER_HOUR=12
      - GLOBAL_PER_DAY=300
      # noisy demo hall: tune via .env without code changes
      - VAD_TYPE=${VAD_TYPE:-server_vad}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.85}
      - VAD_SILENCE_MS=${VAD_SILENCE_MS:-800}
      - NOISE_REDUCTION=${NOISE_REDUCTION:-far_field}
      - INTERRUPT_RESPONSE=${INTERRUPT_RESPONSE:-1}
    ports:
      - "127.0.0.1:18142:8080"
